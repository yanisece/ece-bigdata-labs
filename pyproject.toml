[project]
name = "ece-bigdata-labs"
version = "0.1.0"
description = "Dataset generators for the ECE Big Data Framework labs"
readme = "README.md"
authors = [
    { name = "y-kedjem-ece", email = "yanis.kedjem@edu.ece.fr" }
]
requires-python = ">=3.13"
dependencies = [
    "faker>=40.41.0",
]

[project.scripts]
dataset-users = "ece_bigdata_labs.dataset_users:main"
dataset-orders = "ece_bigdata_labs.dataset_orders:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
